name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/sofi-it-build-spec

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /SoFi-Coach/
          # Hosted Claude + SerpAPI (Google Shopping, then eBay). Laptop can stay closed.
          VITE_SCAN_API: ${{ vars.VITE_SCAN_API || secrets.VITE_SCAN_API }}
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/scan dist/scan/host dist/live dist/live/host
          cp dist/index.html dist/scan/index.html
          cp dist/index.html dist/scan/host/index.html
          cp dist/index.html dist/live/index.html
          cp dist/index.html dist/live/host/index.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
